<!DOCTYPE html>
<html>
<body>
<h2>维修人员工单</h2>
{% for item in orders %}
<div>
工单ID：{{item[0]}}，地点：{{item[1]}}，问题：{{item[2]}}，紧急度：{{item[3]}}，状态：{{item[5]}}
<form method="post">
<input type="hidden" name="oid" value="{{item[0]}}">
<select name="status">
<option>待处理</option>
<option>维修中</option>
<option>已完成</option>
</select>
<button>修改状态</button>
</form>
</div>
{% endfor %}
</body>
</html>
