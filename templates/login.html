<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>宿舍报修系统</title>
<style>
body{background:linear-gradient(135deg,#f0ecf7,#ffffff);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Microsoft Yahei;}
.card{background:#e9e4f0;padding:40px 50px;border-radius:12px;box-shadow:0 4px 12px rgba(100,90,130,0.15);width:320px;}
h2{text-align:center;color:#333;margin-top:0;}
.item{margin:18px 0;}
input{width:100%;padding:10px;border:1px solid #c9c2d8;border-radius:6px;box-sizing:border-box;}
button{width:100%;padding:10px;background:#9887b8;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
button:hover{background:#806fa0;}
.msg{color:#e74c3c;text-align:center;font-size:14px;margin:10px 0;}
</style>
</head>
<body>
<div class="card">
<h2>宿舍报修系统登录</h2>
<form method="post">
<div class="item">
账号：<input type="text" name="username" placeholder="stu1 / work1 / admin1">
</div>
<div class="item">
密码：<input type="password" name="password" placeholder="123">
</div>
<div class="item">
<button type="submit">登 录</button>
</div>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for msg in messages %}
    <p class="msg">{{ msg }}</p >
    {% endfor %}
  {% endif %}
{% endwith %}
</form>
</div>
</body>
</html>
